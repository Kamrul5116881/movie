services:
  - type: web
    name: cinevault-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: WATCHMODE_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: SYNC_INTERVAL_HOURS
        value: "6"
